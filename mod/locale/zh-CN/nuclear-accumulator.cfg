[entity-description]
na-enhanced-tank=15×17 完整可用装备网格，原版坦克 5 倍血量、原版煤炭坦克 75% 稳态速度，支持原生远程驾驶。内置 10 MW 裂变电站、六门 72 格自动激光（炮塔 10 倍伤害）、雷达和 100 MJ 电池。2.0 中使用远程改装炮弹发挥主炮射程。 脱离战斗 10 秒后自动修复，每秒恢复 50 点生命值；受击或开火会重新计时。
nuclear-accumulator=36 GJ 原生电池，充放电各 5 MW，具有广域配电站和标准雷达功能。死亡或 D 信号为正时核爆。选中后按 Ctrl+Shift+N 查看或手动引爆。拆除时在回收物品中保存真实电池余电。
