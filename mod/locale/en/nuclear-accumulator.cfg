[entity-description]
na-enhanced-tank=15x17 usable equipment grid, 5x tank health, 75% coal-tank speed, native remote driving. Built-in 10 MW fission reactor, six 72-tile automatic lasers (10x turret damage), radar and 100 MJ internal battery. Use long-range cannon rounds in 2.0. Automatically repairs 50 HP/s after 10 seconds out of combat; incoming hits or weapon fire restart the delay.
nuclear-accumulator=36 GJ battery, 5 MW charge/discharge, substation and standard radar. Explodes on death or positive D signal. Select and press Ctrl+Shift+N to inspect or detonate. Mining preserves the battery charge in the recovered item.
